<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML Web</title>
  <style>
    /* Base Styles */
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      padding: 0;
      background-color: #f4f4f4;
      color: #333;
    }

    h1 {
      text-align: center;
      color: #444;
    }

    ol {
      max-width: 600px;
      margin: 0 auto;
      padding: 10px;
    }

    img {
      display: block;
      max-width: 100%;
      height: auto;
      margin: 20px auto;
      border-radius: 8px;
    }

    table {
      width: 100%;
      max-width: 800px;
      margin: 20px auto;
      border-collapse: collapse;
      background-color: #fff;
    }

    th, td {
      border: 1px solid #ccc;
      padding: 10px;
      text-align: left;
    }

    thead {
      background-color: #eaeaea;
    }

    form {
      max-width: 600px;
      margin: 40px auto;
      background-color: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    label {
      font-weight: bold;
    }

    input[type="text"],
    input[type="password"],
    input[type="date"],
    select {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      margin-bottom: 15px;
      border-radius: 4px;
      border: 1px solid #ccc;
    }

    input[type="submit"] {
      background-color: #007BFF;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    input[type="submit"]:hover {
      background-color: #0056b3;
    }

    /* Responsive Design */
    @media (max-width: 600px) {
      body {
        margin: 10px;
      }

      table, th, td {
        font-size: 14px;
      }

      form {
        padding: 15px;
      }

      h1 {
        font-size: 24px;
      }
    }
  </style>
</head>
<body>
  <h1>HTML WEBSITE</h1>

  <ol type="I">
    <li>Nelson Humphrey</li>
    <li>Gideon Majiwa</li>
    <li>Donald Abungu</li>
    <li>Brighton Otieno</li>
    <li>Caroline Abbott</li>
  </ol>

  <img src="https://images.pexels.com/photos/31147796/pexels-photo-31147796/free-photo-of-majestic-stonehenge-under-cloudy-skies.jpeg?auto=compress&cs=tinysrgb&w=600&lazy=load" alt="stone picture">

  <table>
    <thead>
      <tr>
        <th>Name</th>
        <th>Address</th>
        <th>Mobile</th>
        <th>Email</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>Nelson</td>
        <td>Kisumu</td>
        <td>0763672829</td>
        <td>ochi@gmail.com</td>
      </tr>
    </tbody>
  </table>

  <form>
    <label for="name">NAME</label>
    <input type="text" id="name" placeholder="John Doe" required>

    <label for="password">PASSWORD</label>
    <input type="password" id="password" placeholder="........">

    <label for="date">DATE</label>
    <input type="date" id="date" required>

    <label>GENDER</label><br>
    <input type="radio" name="gender" value="Male"> Male
    <input type="radio" name="gender" value="Female"> Female
    <br><br>

    <label for="country">COUNTRY</label>
    <select name="country" id="country">
      <option value="ug">Uganda</option>
      <option value="ke">Kenya</option>
      <option value="tz">Tanzania</option>
      <option value="rw">Rwanda</option>
    </select>

    <label>Choose your favorite anime characters:</label><br>
    <input type="checkbox" name="favorite" value="luffy"> Luffy<br>
    <input type="checkbox" name="favorite" value="naruto"> Naruto<br>
    <input type="checkbox" name="favorite" value="sun gin whu"> Sun Gin Whu<br><br>

    <input type="submit" value="Submit">
  </form>
</body>
</html>
